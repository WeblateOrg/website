name: Test

on:
  push:
  pull_request:

jobs:
  test:
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        ports:
        - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: weblate
          POSTGRES_DB: weblate
      mariadb:
        image: mariadb:10.11.19@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
        env:
          MARIADB_ROOT_PASSWORD: weblate
          MARIADB_DATABASE: weblate
        ports:
        - 3306:3306
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
        database:
        - sqlite
        - mariadb
        - postgresql
    name: Python ${{ matrix.python-version }}, ${{ matrix.database }}
    env:
      CI_DATABASE: ${{ matrix.database }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
        fetch-depth: 0
    - name: Install apt dependencies
      # gettext is needed as Django uses msgfmt to compile MO files
      run: |
        sudo apt update
        sudo apt install gettext
    - name: Start validation service
      env:
        # renovate: datasource=github-releases depName=gflohr/e-invoice-eu-validator versioning=loose
        VALIDATOR_VERSION: 2.16.4
      run: |
        curl -L "https://github.com/gflohr/e-invoice-eu-validator/releases/download/v$VALIDATOR_VERSION/validator-$VALIDATOR_VERSION-jar-with-dependencies.jar" > /tmp/validator.jar
        PORT=7070 java -jar /tmp/validator.jar > /tmp/validator.log 2>&1 &
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        cache-suffix: test
        version: 0.12.10
    - name: Install Python dependencies
      run: uv sync --dev
    - name: Compile MO files
      run: uv run --no-sync ./scripts/generate-locales
    - name: Collect static files
      run: uv run --no-sync ./manage.py collectstatic
    - name: Django checks
      run: uv run --no-sync ./manage.py check
    - name: Test with Django
      env:
        EINVOICE_VALIDATOR_URL: http://localhost:7070/
      run: uv run --no-sync pytest --junitxml=junit.xml weblate_web
    - name: Coverage
      run: uv run --no-sync coverage xml
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{secrets.CODECOV_TOKEN}} # zizmor: ignore[secrets-outside-env]
        flags: unittests
        name: Python ${{ matrix.python-version }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
    - name: Show validation logs
      if: ${{ !cancelled() }}
      run: cat /tmp/validator.log
permissions:
  contents: read
