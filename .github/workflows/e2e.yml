name: E2E Tests

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-26.04
    name: Playwright E2E Tests
    env:
      DJANGO_SETTINGS_MODULE: weblate_web.settings_test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Setup Weblate
      uses: $/.github/actions/setup-weblate
      with:
        python-version: '3.12'
        cache-suffix: e2e

    - name: Install Playwright browsers
      run: uv run --no-sync playwright install --with-deps chromium

    - name: Install PDF screenshot tools
      run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes ghostscript libharfbuzz-subset0

    - name: Create database
      run: uv run --no-sync ./manage.py migrate

    - name: Sync packages
      run: uv run --no-sync ./manage.py sync_packages

    - name: Run E2E tests
      env:
        DJANGO_ALLOW_ASYNC_UNSAFE: 'true'
      run: |
        uv run --no-sync pytest weblate_web/tests_e2e/ -v --screenshot=only-on-failure --video=retain-on-failure

    - name: Upload test artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      continue-on-error: true
      with:
        name: playwright-test-results
        path: |
          test-results/
          playwright-report/
        retention-days: 7
        overwrite: true

  argos:
    name: Argos CI Upload
    needs: e2e
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Download test artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: playwright-test-results
        path: playwright-artifacts

    - name: Argos CI upload
      env:
        ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }} # zizmor: ignore[secrets-outside-env]
      run: |
        argos_dir="$(mktemp -d)"
        while IFS= read -r screenshot; do
          case "$screenshot" in
            ''|'#'*) continue ;;
          esac
          cp -- "playwright-artifacts/test-results/$screenshot" "$argos_dir/"
        done < .github/argos-screenshots.txt
        npx --package=@argos-ci/cli -- argos upload "$argos_dir"

permissions:
  contents: read
