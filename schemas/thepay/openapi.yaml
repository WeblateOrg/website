      description: |-
        This endpoint will create request for realization of preauthorized payment.

        If you receive response with HTTP status **200** payment is `paid` and realization is **success**.

        If you receive an HTTP status **202**, the payment state changes to `waiting_for_confirmation`.

        You will be notified [notification](#section/Notifications) about the result of the realization and any future changes in the payment state. The payment can change to the `paid` state (if the realization succeeds) or to the `preauth_cancelled` state (if the realization fails).
