info:
  title: ThePay API
  x-logo:
    url: "https://admin.thepay.eu/images/thepay-logo.svg"
    altText: "ThePay"
  version: ""
  description: >-
    This is the online documentation for [ThePay](https://www.thepay.eu/) API
    for merchants.

    This API allows handling payments and provides all neccessary information related.


    ### Environments


    ThePay provides a demo and a production environment.

    The demo environment is intended for testing purposes for developers.

    The production environment is the live system.


    | Environment  | URL |

    |---|---|

    | Production  | `https://api.thepay.cz/`  |

    | Demo  | `https://demo.api.thepay.cz/` |


    For both environments, be it production or testing, an account in merchant administration is needed.

    The merchant administration is a place where you manage your project, accounts and everything related.


    If you are a developer, please create an account in the demo merchant administration as your first step.

    The merchant administration provides you with the neccessary credentials and setup to connect to our system.


    | Merchant administration  | Administration URL |

    |---|---|

    | Production  | `https://admin.thepay.eu/`  |

    | Demo  | `https://demo.admin.thepay.eu/` |


    <b>💡 Quick hint:</b>


    - There are two environments, production and demo


    - Both environments require registration in the merchant administration


    # Support & Contributions


    We use Github repository for managing our PHP SDK and we use Github issues for **technical support**.


    If you find any bug 🐞, please submit the [issue](https://github.com/ThePay/api-client/issues/new/choose) directly to Github .


    Feel free to contribute via Github [issues](https://github.com/ThePay/api-client/issues),

    take a look there if you have any problems with implementation or whenever you think than the API needs some improvement.

    We will respond as soon as possible.


    # Authentication


    All communication with ThePay system is secured by appropriate headers and IP address whitelist [🔗](#section/Authentication/IP-limitation).

    The requests you send have to to contain the following headers:


    `Signature` [🔗](#section/Authentication/Signature)


    `SignatureDate` [🔗](#section/Authentication/SignatureDate)


    Additionally, each request requires an unique merchant ID (`merchant_id`) as part of query string [🔗](#section/Authentication/Merchant-ID).


    ```bash

    curl --include \
        -H 'Signature: calculated_hash' \
        -H 'SignatureDate: Mon, 23 Sep 2019 06:07:08 GMT'
        -H 'Content-Type: application/json' \
       'https://api.thepay.cz/v1/payments?merchant_id=6cdf1b24-0479-4a64-b076-b0ece482453f'
    ```


    <b>💡 Quick hint:</b>


    - All communication is secured with the `Signature` and `SignatureDate` headers


    ## Password for API


    A secret password is needed for accessing the API. This password is used in the process of calculating the signature header.

    This password is generated in the Implementation section of the merchant administration.


    <b>💡 Quick hint:</b>


    - Setup in the Implementation section of the merchant administration


    - The value is used in the calculation of `Signature` header


    ## SignatureDate


    The current datetime, in the RFC7231 format, is used as one of the inputs when calculating the signature header.

    The datetime has to be also sent in the request headers as `SignatureDate`.


    The `SignatureDate` will be accepted only if the time difference is no bigger than 20 seconds.


    <b>💡 Quick hint:</b>


    - The current datetime is sent as `SignatureDate` in the RFC7231 format


    - The value is used in the calculation of `Signature` header


    - The time difference must not exceed 20 seconds


    ## Merchant ID


    Each merchants has an unique ID, which can be found in the Implementation section of the merchant administration portal.


    The merchant ID is used as one of the inputs when calculating the signature header.


    The merchant ID is also a **required** part of the query string for all requests to the API:


    | key | value |

    | --- | --- |

    | `merchant_id` | the actual ID from [admin panel](https://www.thepay.eu) |


    E.g. - `?merchant_id=6cdf1b24-0479-4a64-b076-b0ece482453f`


    <b>💡 Quick hint:</b>


    - Can be found in the Implementation section of the merchant administration


    - The value is used in the calculation of `Signature` header


    - The value is a required part of the query string for all requests


    ## Signature


    The `Signature` header is calculated as a hash of the 3 following variables appended together:


    - `merchant_id`[🔗](#section/Authentication/Merchant-ID)


    - `password`[🔗](#section/Authentication/Password-for-API)


    - current `dateTime`[🔗](#section/Authentication/SignatureDate).


    `hash256( merchant_id + password + DateTime )`


    1. Prepare the string for hashing in format: `merchant_idPasswordDatetime`, for example `1passwordMon, 23 Sep 2019 06:07:08 GMT`


    2. Hash the string with sha256 hash function, example result may be `e8e3e040f5772cd70111454fde0639c701cf1ce86929b0a5a9f0a15cb5634138`


    3. Add resulting value to headers as `Signature`


    ## IP limitation


    The access to the API is limited by whitelist of IP addresses.

    Allowed IP adresses are managed in the merchant administration in the Implementation section.


    You can specify a subnet with the * notation, in case the IP address might change in time.


    It is also possible to allow communication from anywhere, by supplying * only.

    This is ok for development purposes, but we don't recommend such practice in the production environment.


    <b>💡 Quick hint:</b>


    - Every merchant must configure allowed IP addresses


    - Setup in the Implementation section of the merchant administration


    - Usage of subnets is allowed


    ## Number of requests limitation (throttling)


    For security or to prevent overloading, the API is limited to handle 60 <b>failed</b> requests per minute.

    These limits are applied to a particular IP address.


    A failed request is considered any which is not in the 2xx Success code range.


    After request processing if response status code is success the request counter will be reset to zero, and all following successful requests will pass through.


    You can get a throttling error if you send requests faster than our API can handle.

    For example, if your first request waiting for processing and meanwhile you send more requests than the limit some of them can fail, because we are not capable of finishing the first one.


    If this limit is exceeded, a response code of 429 will be returned.


    ```

    429 Too Many Requests


    {
        "message": "Too Many Requests"
    }

    ```


    <b>💡 Quick hint:</b>


    - You are limited to 60 failed request per minute


    - A 429 response will be returned upon exceeding the limit


    - You should periodically scheduled API calls run synchronously


    ## Underlying protocol


    Support of at least TLS1.2 is required, as it is used for securing the communication channel. No older protocol versions are supported.


    <b>💡 Quick hint:</b>


    - The minimum supported version of TLS is 1.2


    # Enums

    ## Notification types


    | Value | Description |

    | --- | --- |

    | `state_changed` | Payment state has been changed. |

    | `offset_account_obtained` | Obtained the customer's bank account number and owners name |


    # Maintenance


    In rare occurences, it may happen that we have to temporarily shut down our system for maitenance.


    This would cause all API endpoints to return `503` error response, without executing any logic.


    ```http

    503 Service Unavailable

    Unavailable-Until: Sat, 01 Jun 2024 13:00:00 GMT


    {
        "message": "Service Unavailable"
    }

    ```


    API response can contains custom header `Unavailable-Until` with datetime in RFC7231 format,

    suggesting the time when our API should be available again.


    In case of planned maintenance, we will inform our clients about the situation.

    It would be however appropriate to implement logic on your side, which will handle the maintenance response,

    to inform the customer about the situation properly.


    We strongly recommend disabling any functionality which requires our API during a maintenance,

    by detecting `503` response.


    After you detect success response by calling

    [ThePay API ping](#tag/API-Status/paths/~1v1~1ping/get)

    endpoint in reasonable interval, you can safely reactivate your functionality.

    If we provide `Unavailable-Until` header, you can delay start of calling ping,

    because in unavailable time API will response only 503 response

    and nothing interesting will happened in the meanwhile.


    # Versioning


    All API endpoints has own version specify in URL path example: `/v1/payments` where `/v1/` is version number.


    Bigger version number means more recent endpoint implementation.


    Different endpoint versions can combine, for example you can create payment using endpoint with version v1

    and read payment detail using endpoint version v2.


    If you developing new integration or making some integration changes, **you should use newest version** of endpoint available.


    Old versions are kept only for backward compatibility and you should avoid using it,

    and we mark old implementation as deprecated, in documentation here by some label

    and also in our implementation by `Deprecated` custom HTTP header.


    ```http

    200 OK

    Deprecated: Use new endpoint version specify in API doc: https://docs.thepay.eu/#tag/Payments/paths/~1v1~1payments/get

    ```


    You should detect deprecated header in HTTP communication from our system and when it appears you should record this information.

    Mechanism like this can keep integration of our API up to date.


    <b>💡 Quick hint:</b>


    - Log deprecated message into your log monitoring


    - Show some alert in merchant administration and describe that they need contact some developer for integration changes


    # Projects


    A project represents one aplication accepting payments through ThePay payment gateway, for example one particular e-shop.

    Any payment is always processed in relation to its project.


    The merchant can create any number of projects under their merchant account, according to his or her needs.

    The projects are managed in the merchant administration through a simple project request process.


    <b>💡 Quick hint:</b>


    - You should request a project for each separate e-shop website


    - A merchant can have any number of projects


    - The projects are created and managed in the merchant administration


    # Pagination


    Some endpoints have pagination to prevent heavy requests (for example Get Payments and Get Account Transaction History).


    Endpoints with pagination can be recognized by having optional parameters "limit" and "page" in the URL.

    These parameters are optional and have default values.


    Endpoints using pagination will respond with two special headers:


    - "X-Total-Count" - Determines the total count of entries.


    - "Link" - Contains a link to next page in [HTTP format](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Link). This value may be empty if there is no next page.


    # Notifications


    Notifications alert you about updates on payments.

    The mechanism works by us calling your chosen endpoint through a GET request.


    ### When do we send notifications


    The notification url gets called in the following cases:


    - Change in payments state


    - Upon supplementation of the customer's bank account number and owner name


    ### Setting the notification url


    The url of your endpoint which should be called can be set on payment creation, as an optional parameter.

    It is also possible to set up a default notification url in project settings section in merchant administration.

    If the notification url is neither sent as a parameter nor set as the default in project settings, notifications will be sent to the return url of the particular payment (the `return_url` parameter or the default return url of the project).

    Notifications are not sent only if the payment has no return url either.


    #### Setting the notification url on payment creation


    The notification url is set by parameter <b>notif_url</b> on payment creation, which can be done through calling the Create New Payment API endpoint or redirection with Create Payment Query.

    If this parameter is not set, the default url for notification will be used instead if available.


    #### Default url for notifications


    The default url for notifications can be set in your project settings in merchant administration.

    This default value will be used only in case the `notif_url` is not used as a parameter when creating the payment.


    ### Recognizing the payment


    Each notification contains the <b>project_id</b> and <b>payment_uid</b> in the query parameter.

    Note that if these attributes are already set on your side, they will be overwritten.


    ### Notification type


    We also pass a <b>notification type</b> as `type` in the query, see [list of available types](#section/Enums/Notification-types).

    You can filter the notifications using the `type` GET parameter.


    It is possible to forbid the `offset_account_obtained` notification type in the merchant administration.

    In that case, notification regarding obtaining the customer's bank account number and name won't be sent to you.


    <b>Notifications don't necessarily mean the payment has been paid. They just inform you about a change.

    You should follow up with checking the payment detail upon receiving the notification.</b>


    ### Example notification


    Example notification for payment with the following parameters may look like this:


    - project id: 1212


    - payment uid: 30de400


    - event: payment state change (e.g. the payment was paid)


    - notification url: chosen by you


    `GET <notification_url>?project_id=1212&payment_uid=30de400&type=state_changed`


    ### Expected response to notifications


    Your notification endpoint should return http status code **200** in a **10 second time window** after receiving the request.

    Otherwise the notification will be considered as failed and new notification try will be scheduled with some delay, with a limited number of tries.


    This means it is possible to get the same notification multiple times.


    The notifications can also be sent manually from merchant administration in the payment detail.


    <b>💡 Quick hint:</b>


    - Notification alert you about updates on a particular payment.


    - You should check the payment details upon receiving the notification.


    - Notifications are sent until we receive a 200 response, or the number of tries runs out.


    - The notification_type specifies what parameter has changed on the payment.


    # Subscription payments


    It is possible to create long term subscription for your customers.

    This gives you the option to repeatedly charge the customer, without the need for the customer to authorize each payment individually.


    Each subscription consist of one parent payment and any number of child payments.


    #### Parent payment


    The parent payments created through the same endpoint as regular payments, but with the subscription properties set.


    #### Child payments


    Subsequent child payments are realized through dedicated endpoints, depending on the subscription type.


    Each child payment must reference a parent payment.


    #### Types of subscriptions


    There are three different use cases with different endpoints for subscription payments.

    These depend on payment intervals and the amount paid:

    |Subscription type|Time interval|Payment amount|Example usage|

    |---|---|---|---|

    |<b>Regular</b>|Fixed|Fixed|Monthly payment for a newsletter subscription|

    |<b>Usage-based</b>|Fixed|Variable|Monthly invoice for service usage|

    |<b>Irregular</b>|Variable|Fixed|Credit recharge upon |


    The variables with fixed type are always set on the parent payment.

    It is your responsibility to adhere to the values set in the parent payment!


    If you encounter a situation where you need to change the fixed payment amount or time period, a new parent payment with different parameters must be used.


    <b>💡 Quick hint:</b>


    - Subscription allow seamless process of repeating payments, without the need of authorizing each individual payment.


    - Subscriptions consist of one parent payment and any number of child payments


    - There are three subscription types: Regular, Usage-based, Irregular


    - If you would need to change any of the fixed subscription parameters, you should create a new subscription instead. This allows the customer to review and authorize the new subscription conditions.


    ### Testing subscription payments on the Demo enviroment


    The demo allows you to test specific subscription payment states. Follow these steps:


    1. **Create a Parent (Master) Payment:**
       Begin by creating a standard parent payment. Simulate this payment as `paid` to proceed with further testing.

    2. **Create a Child Payment:**
       Use the API to create a child payment. To test specific states, include a special value in the `description_for_merchant` field. The supported values and their purposes are:

       | `description_for_merchant`             | Purpose                                                                                                           |
       |----------------------------------------|-------------------------------------------------------------------------------------------------------------------|
       | **error_parent_invalid**               | Changes the state of the parent payment to `expired`. No further child payments can be created. Expired state is returned.                   |
       | **error_technical**                    | Simulates a technical error, setting the current child payment's state to `error`. Creating child payments remain possible. |
       | **waiting_for_confirmation_error**     | Initially sets the payment state to `waiting_for_confirmation` and returns this state in the response. After 5 seconds, the state automatically transitions to `error`. **Note:** In V1 deprecated endpoints, the `waiting_for_confirmation` state is not supported - this scenario will behave as `error_technical` instead.               |
       | **waiting_for_confirmation_paid**      | Initially sets the payment state to `waiting_for_confirmation` and returns this state in the response. After 5 seconds, the state automatically transitions to `paid`. **Note:** In V1 deprecated endpoints, the `waiting_for_confirmation` state is not supported - this scenario will behave as `error_technical` instead.                    |

    3. **State Change Notifications:**
       All state changes trigger a [notification](#section/Notifications).
       **Note:** Notifications are delayed by at least 60 seconds by default.

    # Saving card authorization


    It is possible to save customer card information by using the `save_authorization` parameter upon payment creation.


    This allow easier and seamless payment creation, through following child payments, without additional customer card authorization.

    The customer should still authorize the payment itself.


    <b>💡 Quick hint:</b>


    - Saving card authorization allows easier payment process, through remembering customer card information.


    - While the customer doesn't need to authorize the payment card, the customer should still authorize the payment itself.


    - Saving card authorization shoudn't be confused with (and used for) subscription payments.
servers:
  - url: https://demo.api.thepay.cz
x-tagGroups: # https://redocly.com/docs/realm/content/api-docs/openapi-extensions/x-tag-groups
  - name: System Status
    tags:
      - API Status
  - name: Data Retrieval
    tags:
      - Project Info
      - Payments
      - Transactions
  - name: Payment Creation
    tags:
      - Payment Creation
      - Subscriptions
      - Saved Card Authorization
  - name: Payment Management
    tags:
      - General Payment Management
      - Preauthorized Payments
      - Refunds
  - name: Outgoing Payments
    tags:
      - Outgoing Payment Creation
      - Outgoing Payment Data Retrieval
  - name: Maintenance
    tags:
      - Changelog
tags:
  - name: API Status
  - name: Project Info
  - name: Payments
  - name: Transactions
  - name: Payment Creation
  - name: Subscriptions
  - name: Saved Card Authorization
  - name: General Payment Management
  - name: Preauthorized Payments
    description: |-
      You can realize or cancel payment in state: `preauthorized`.
      Preauthorized payment has **7 days expiration**, after successful payment preauthorization.

      In the expiration payment state changes into: `preauth_expired`
      and endpoints for managing preauthorized payments will return error response.

      💡 **Quick hint:**
      - You can use [notifications](#section/Notifications) for detection when payment state change from `preauthorized` into another one and synchronize this update into your system preventing API calls from failing.
      - Or you should check current payment state (call [payment detail](#tag/Payments/paths/~1v1~1projects~1{project_id}~1payments~1{payment_uid}/get)), if the state is still `preauthorized` before you call realization or cancel preauthorized payment.
  - name: Refunds
  - name: Outgoing Payment Creation
    description: |-
      Outgoing payments allow sending money to valid IBAN using bank transactions.

      Outgoing payments must be enabled by ThePay individually per project. If you are interested in this feature, please contact our operators.

      #### Testing outgoing payments on the Demo environment

      The demo allows you to test specific outgoing payment states by including  a special value in the `description_for_merchant` field. The supported values and their purposes are:

      | `description_for_merchant`     | Purpose            |
      |--------------------------------|--------------------|
      | **cancelled**                  | Simulates a cancellation 1 minute after creation. This only triggers if the payment is in the waiting_for_sending state. (Note: To test this, the payment amount must exceed the merchant's account balance, since the payment would get automatically sent outherwise if there are sufficient funds.).    |
      | **undeliverable**              | Sets the payment state to undeliverable 1 minute after creation. This only triggers if the payment is in the sent state. If the payment is still in a waiting state (e.g., due to insufficient funds), nothing will happen.   |
      | **returned**                   | Sets the payment state to returned 1 minute after creation. This only triggers if the payment is in the sent state. If the payment is still in a waiting state (e.g., due to insufficient funds), nothing will happen.  |

      **State Change Notifications:**
      All state changes trigger a [notification](#section/Notifications).
      **Note:** Notifications are delayed by at least 60 seconds by default.
  - name: Outgoing Payment Data Retrieval
  - name: Changelog
    description: |-
      ## Release 2026-02

      ### Enhanced IBAN Validation

      IBAN validation has been strengthened to comply with both ISO 13616 international standards and country-specific national requirements. All outgoing payment endpoints now validate:
      - ISO 13616 format compliance
      - National checksum validation specific to each country
      - For Czech IBANs (CZ): Additional modulo-11 validation for account prefix and account number

      See the endpoint documentation for `offset_iban` property for country-specific requirements.

      ## Release 2025-04

      ### New endpoint - Get Outgoing Payment Confirmation

      [Returns a pdf confirmation of outgoing payment.](#tag/Outgoing-Payment-Data-Retrieval/paths/~1v1~1projects~1{project_id}~1outgoing_payments~1{payment_uid}~1generate_confirmation/get)


      ## Release 2024-08

      ### New endpoint version - V2 Realize Regular Subscription Paymen

      [Will create request for realization of new subscription payment.](#tag/Subscriptions/paths/~1v2~1projects~1{project_id}~1payments~1{parent_payment_uid}~1subscription~1regular/post)

      ### New endpoint version - V2 Realize Usage Based Subscription Payment

      [Will create request for realization of new usage based subscription payment.](#tag/Subscriptions/paths/~1v2~1projects~1{project_id}~1payments~1{parent_payment_uid}~1subscription~1usagebased/post)

      ### New endpoint version - V2 Realize Irregular Subscription Payment

      [Will create request for realization of new irregular subscription payment.](#tag/Subscriptions/paths/~1v2~1projects~1{project_id}~1payments~1{parent_payment_uid}~1subscription~1irregular/post)

      ### New endpoint version - V2 Realize Payment By Saved Authorization

      [Will create request for realization of new payment by saved authorization.](#tag/Saved-Card-Authorization/paths/~1v2~1projects~1{project_id}~1payments~1{parent_payment_uid}~1savedauthorization/post)

      ### New endpoint version - V2 Realize Preauthorized Payment

      [Will create request for realization of preauthorized payment.](#tag/Preauthorized-Payments/paths/~1v2~1projects~1{project_id}~1payments~1{payment_uid}~1preauthorized/post)

      Between v1 endpoints and v2 is break change, if you using v1 of listed endpoints, check differencies in interface and update your integration.
      Do not worry we keep old version running for backward compatibility.


      ## Release 2023-06

      ### New endpoint - Generate Confirmation of Payment

      [Returns a pdf confirmation of payment.](#tag/Payments/paths/~1v1~1projects~1{project_id}~1payments~1{payment_uid}~1generate_confirmation/get)

      ### New endpoint - Get Balance History

      [Returns the account balance to a particular date and time.](#tag/Transactions/paths/~1v1~1balances/get)


      ## Release 2023-09

      ### New error code - 503 Service Unavailable

      [Maintenance section describe how our API behave while is planned shutdown](#section/Maintenance)
paths:
  /v1/ping:
    get:
      summary: ThePay API ping
      description: |-
        If you want to detect the availability of our API or just to test [authentication](#section/Authentication),
        you can use this ping endpoint with any HTTP method.

        This endpoint only returns `200` response with the same body body as in request.
      tags:
        - API Status
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestData"
        "503":
          $ref: "#/components/responses/503"
  /v1/projects:
    get:
      summary: Get Projects
      description: |-
        Returns an array of project instances for your merchant account.
      tags:
        - Project Info
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/MerchantIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
  "/v1/projects/{project_id}/methods":
    get:
      summary: Get Payment Methods
      description: |-
        Returns a list of all available payment methods for your project.

        Allowed methods settings can be changed in merchant administration under the project gate settings section.
      tags:
        - Project Info
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
        - $ref: "#/components/parameters/LanguageQuery"
        - $ref: "#/components/parameters/CountryCodesQuery"
        - $ref: "#/components/parameters/CurrencyCodesQuery"
        - $ref: "#/components/parameters/RequiredTagsQuery"
        - $ref: "#/components/parameters/ForbiddenTagsQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
  /v1/payments:
    get:
      summary: Merchant - Get Payments
      description: |-
        Returns a list of payments belonging to a particular merchant account.
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/MerchantIdQuery"
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/StateQuery_Payment"
        - $ref: "#/components/parameters/CurrencyQuery"
        - $ref: "#/components/parameters/AmountFromQuery"
        - $ref: "#/components/parameters/AmountToQuery"
        - $ref: "#/components/parameters/CreatedFromQuery"
        - $ref: "#/components/parameters/CreatedToQuery"
        - $ref: "#/components/parameters/FinishedFromQuery"
        - $ref: "#/components/parameters/FinishedToQuery"
        - $ref: "#/components/parameters/PaymentMethodQuery"
        - $ref: "#/components/parameters/OrderIdQuery"
      responses:
        "200":
          description: OK
          headers:
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
  "/v1/projects/{project_id}/payments":
    get:
      summary: Project - Get Payments
      description: Returns a list of payments belonging to a particular project.
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/StateQuery_Payment"
        - $ref: "#/components/parameters/CurrencyQuery"
        - $ref: "#/components/parameters/AmountFromQuery"
        - $ref: "#/components/parameters/AmountToQuery"
        - $ref: "#/components/parameters/CreatedFromQuery"
        - $ref: "#/components/parameters/CreatedToQuery"
        - $ref: "#/components/parameters/FinishedFromQuery"
        - $ref: "#/components/parameters/FinishedToQuery"
        - $ref: "#/components/parameters/PaymentMethodQuery"
        - $ref: "#/components/parameters/OrderIdQuery"
      responses:
        "200":
          description: OK
          headers:
            Link:
              schema:
                type: string
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
    post:
      summary: Create New Payment
      description: |-
        Creates new payment instance and returns URL to the payment process and
        URL to the payment detail page.

        In case a matching payment already exists, returns the urls of the same payment.

        Once the payment is created, the parameters of the payment cannot be changed (this includes `order_id`, `currency_code` and `amount`).

        Upon calling this endpoint with a combination of `uid`, `currency_code` and `amount` of an already existing payment, the urls of the existing payment will be returned. No new payment will be created in this case.

        If you want to change any of the payment parameters you must create a new payment with the updated values.

        If you intend to display the payment method buttons on your side and send the customer directly to the particular payment method, you will need the appropriate payment method codes.

        Do NOT use these codes as static values in your code. The payment methods are regularly updated, new methods are added and old ones removed. Instead retrieve the current payment methods dynamically from the
         [Get Payment Methods endpoint](#tag/Project-Info/paths/~1v1~1projects~1{project_id}~1methods/get).

        The customer contact is required and might be passed either as email or phone attribute under the customer object. Therefore both or at least one of those attributes must be passed when creating the payment.
      tags:
        - Payment Creation
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_deposit:
                  type: boolean
                  default: true
                  description: |-
                    If set to false the payment will be created as "pre-authorization" and can be realised later using the "Realize Preauthorized Payment" endpoint. After preauthorizing the payment, a period of 7 days to realise the pre-authorized payment starts.
                can_customer_change_method:
                  type: boolean
                  default: true
                  description: |-
                    If set to false the customer is not allowed to change the payment method.
                payment_method_code:
                  type: string
                  description: |-
                    The code of payment method. It is **required if** `can_customer_change_method` **is set to false**, otherwise optional.
                    If not provided, the customer selects the payment method at the payment gateway page.
                amount:
                  allOf:
                    - $ref: "#/components/schemas/Type_MoneyAmount"
                    - type: string
                      format: integer
                      minimum: 1
                currency_code:
                  $ref: "#/components/schemas/Type_MoneyCurrency"
                uid:
                  $ref: "#/components/schemas/Type_PaymentUid"
                order_id:
                  $ref: "#/components/schemas/Type_OrderId"
                description_for_customer:
                  $ref: "#/components/schemas/Type_DescriptionForCustomer"
                description_for_merchant:
                  $ref: "#/components/schemas/Type_DescriptionForMerchant"
                return_url:
                  allOf:
                    - $ref: "#/components/schemas/Type_Url"
                    - maxLength: 4000
                      description: |-
                        After a successful payment, the customer is redirected to the return URL with **payment_uid** and **project_id** query parameters.
                        You have to call the payment status API to check if the payment was paid.
                        If not present the project default return url defined in your ThePay account will be used.
                        **If the default return url is not defined, this attribute is required.**
                notif_url:
                  $ref: "#/components/schemas/NotifUrl"
                is_customer_notification_enabled:
                  type: boolean
                  nullable: true
                  description: |-
                    Allows enabling or disabling of all e-mail notifications for customer about payment.
                    Overrides project settings configured in ThePay administration.
                valid_to:
                  type: string
                  format: date-time
                  description: |-
                    Date and time in RFC 3339 / ISO 8601 format until which the payment is valid, i.e. the deadline by which the customer can pay it.
                    After this time the payment expires and can no longer be paid.

                    **Min 5 minutes after datetime of payment creation.**
                    **Max 5 years after datetime of payment creation.**
                    **Default 14 days after datetime of payment creation.**
                save_authorization:
                  type: boolean
                  default: false
                  description: |-
                    After customer authentication, authorization will be save to payment and it enables [Realize payment by saved authorization](#tag/Saved-Card-Authorization/paths/~1v2~1projects~1{project_id}~1payments~1{parent_payment_uid}~1savedauthorization/post) endpoint for future payment realization.
                language_code:
                  allOf:
                    - $ref: "#/components/schemas/Type_LanguageCode"
                    - description: |-
                        Language of the customer
                customer:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 255
                    surname:
                      type: string
                      maxLength: 100
                    email:
                      type: string
                      format: e-mail address
                      description: |-
                        **required** if phone is not present, The domain contained in the e-mail address must have a valid mx record.
                        If supplied by customer, we recommend checking the email, eg. with some sort of online DSN validation, for preventing typos.
                      example: jane.doe@example.com
                    phone:
                      type: string
                      format: msisdn
                      maxLength: 15
                      description: |-
                        **required** if email is not present, https://en.wikipedia.org/wiki/MSISDN
                      example: 420589687963
                    billing_address:
                      $ref: "#/components/schemas/Address"
                    shipping_address:
                      $ref: "#/components/schemas/Address"
                  required:
                    - name
                    - surname
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/PaymentItem"
                subscription:
                  properties:
                    type:
                      type: string
                      enum:
                        - regular
                        - usagebased
                        - irregular
                      description: |-
                        Type describing subscription behavior, define which endpoint is enabled for future payment realization.
                    period:
                      type: integer
                      minimum: 1
                      nullable: true
                      description: |-
                        **required if type is `regular` or `usagebased`**

                        Minimum days between payments realization, how often should be subscription paid.
                  required:
                    - type
                  description: |-
                    Information about long time subscription, repeatedly paid by customer.
                  nullable: true
                  type: object
              required:
                - amount
                - currency_code
                - uid
                - language_code
                - customer
              example:
                is_deposit: true
                can_customer_change_method: true
                payment_method_code: card
                amount: "10000"
                currency_code: CZK
                uid: 30de400
                order_id: "2019000001"
                description_for_customer: Thanks for your order
                description_for_merchant: This is very important
                return_url: https://example.com?return=30de400
                notif_url: https://example.com?notif=30de400
                is_customer_notification_enabled: false
                valid_to: 2019-09-23T09:49:54+02:00
                save_authorization: false
                language_code: cs
                customer:
                  name: Jane
                  surname: Doe
                  email: jane.doe@gmail.com
                  phone: "420589687963"
                  billing_address:
                    country_code: GB
                    city: London
                    zip: NW1
                    street: Baker Street 221B
                  shipping_address:
                    country_code: GB
                    city: London
                    zip: NW1
                    street: Baker Street 221B
                items:
                  - type: item
                    name: Some item
                    count: 2
                    total_price: "10000"
                    ean: "978020137962"
                subscription:
                  type: regular
                  period: 30
      responses:
        "200":
          description: |-
            A payment was created with same `uid`, `amount`, `currency_code` in the past,
            urls for existing payment is returned and nothing is updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment_Creation"
        "201":
          description: Payment created in current api call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment_Creation"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "409":
          description: |-
            Tried to insert a duplicate record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Payment with this UID was already created with different request body data.
        "429":
          $ref: "#/components/responses/429"
