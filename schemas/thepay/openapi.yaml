  "/v1/transactions/{account_iban}/account_statement/gpc":
    get:
      summary: Get Account Statement - GPC
      description: |-
        Returns an account statement for the specified account and time period in GPC format.

        The export includes all transactions for the specified date range (and currency if specified). The **Variable Symbol (VS)** field in the export is determined by the `payment_identifier` parameter:

        * `order_number` (default): Uses the order ID from the [payment](#tag/Payments/paths/~1v1~1projects~1{project_id}~1payments~1{payment_uid}/get). If the order_number contains non-digit characters or exceeds 10 characters in length, a string of 10 zeros will be used.
        * `uid`: Uses the [payment](#tag/Payments/paths/~1v1~1projects~1{project_id}~1payments~1{payment_uid}/get) UID. If the UID contains non-digit characters or exceeds 10 characters in length, a string of 10 zeros will be used.
        * `id`: Uses the ThePay [payment](#tag/Payments/paths/~1v1~1projects~1{project_id}~1payments~1{payment_uid}/get) ID

        **Important:** For outgoing transactions, the real variable symbol from the transaction is always used, regardless of the `payment_identifier` setting.

        If `currency_code` is specified, the export will be filtered to only include transactions in that currency, and a summary section will be added to the header containing:
        * Initial balance
        * Final balance
        * Total debit (outgoing transactions)
        * Total credit (incoming transactions)

        The response is a binary file stream in windows-1250 encoding that should be saved with a `.gpc` extension.

        **Rate limit** is 2 exports per minute. Maximum period is 90 days.
      tags:
        - Transactions
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - name: account_iban
          in: path
          description: |-
            The IBAN of account for which you want to retrieve the account statement.
          required: true
          schema:
            $ref: "#/components/schemas/Type_Iban_Internal"
        - $ref: "#/components/parameters/MerchantIdQuery"
        - name: date_from
          in: query
          required: true
          description: |-
            Start date of the period for which to generate the statement (inclusive).
            Format: YYYY-MM-DD
          schema:
            type: string
            format: date
          example: 2024-01-01
        - name: date_to
          in: query
          required: true
          description: |-
            End date of the period for which to generate the statement (inclusive). Must be after or equal to date_from and not more than 90 days after date_from.
            Format: YYYY-MM-DD
          schema:
            type: string
            format: date
          example: 2024-01-31
        - name: currency_code
          in: query
          required: false
          description: |-
            Optional currency code to filter transactions. If specified, only transactions in this currency will be included,
            and a summary section with balances and totals will be added to the GPC header.
          schema:
            $ref: "#/components/schemas/Type_MoneyCurrency"
        - name: payment_identifier
          in: query
          required: false
          description: |-
            Determines what value will be used in the Variable Symbol (VS) field of the GPC export:
            * `order_number` (default): Uses the order ID from the payment
            * `uid`: Uses the payment UID
            * `id`: Uses the ThePay payment ID

            **Note:** For outgoing transactions, the real variable symbol from the transaction is always used, regardless of this setting.
          schema:
            type: string
            enum:
              - order_number
              - uid
              - id
            default: order_number
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              example: |
                0740001070000000107Účet #1             13052000000000000000+00000000000000+00000000000000+00000000000000+001261125              
                0750000000000000000000107000000010700000000335420000004660702000000000000000000000000000000261125payment             00348261125
                0750000000000000000000107000000010700000000335400000017036352000000000000000000000000000000261125payment             00978261125
                0750000000000000000000107000000010700000000335380000012410902000000000000000000000000000000261125payment             00978261125
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="gpc_export_TP7811112150822790787055_1234567890.gpc"'
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
  "/v2/projects/{project_id}/payments/{parent_payment_uid}/subscription/regular":
    post:
      summary: V2 Realize Regular Subscription Payment
      description: |-
        This endpoint will realize new payment for the same subscription as its
        parent payment.
        Through this endpoint, realization of subscription payment can be only done **once per given period** and payment **amount can't be changed**.

        * Fixed payment period
        * Fixed payment amount

        If the realization return `parent.recurring_payments_available` as `false` the subscription should end, because the realization of new payments through the parent payment is no longer available.
        In this case, we recommend to inform the customer to create a new order for his favorite subscription.

        If you receive an HTTP status **202**, the payment state changes to `waiting_for_confirmation`.
        You will be notified [notification](#section/Notifications) about the result of the realization and any future changes in the payment state. The payment can change to the `paid` state (if the realization succeeds) or to the `error` state (if the realization fails).

        In case of an `error` state, you should check the `parent.recurring_payments_available` property in the [payment detail](#tag/Payments/paths/~1v1~1projects~1{project_id}~1payments~1{payment_uid}/get) response to determine if the subscription should end.
      tags:
        - Subscriptions
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - name: parent_payment_uid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Type_PaymentUid"
          description: |-
            UID of payment which initialized this subscription.
            It is the first payment created with `subscription.type` **regular** through endpoint [Create new payment](#tag/Payment-Creation/paths/~1v1~1projects~1{project_id}~1payments/post).
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  description: |-
                    UID of the new payment which will be realized.
                    Payment identification in your system, must be unique per project.
                  allOf:
                    - $ref: "#/components/schemas/Type_PaymentUid"
                order_id:
                  $ref: "#/components/schemas/Type_OrderId"
                description_for_merchant:
                  $ref: "#/components/schemas/Type_DescriptionForMerchant"
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/PaymentItem"
                  nullable: true
                  description: |-
                    If this attribute is set to null, items will be copied from the parent payment.
                notif_url:
                  $ref: "#/components/schemas/NotifUrl"
              required:
                - uid
              example:
                uid: efd7d8e6-asd5-3c46-b475-51762331b979
                order_id: order-123
                description_for_merchant: description that will be shown in admin
                items:
                  - type: item
                    name: Some item
                    count: 2
                    total_price: "10000"
                    ean: "978020137962"
                notif_url: https://thepay.eu/notify
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SynchRecurringPaymentResult"
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingConfirmationRecurringPaymentResult"
        "404":
          $ref: "#/components/responses/404"
  "/v2/projects/{project_id}/payments/{parent_payment_uid}/subscription/usagebased":
    post:
      summary: V2 Realize Usage Based Subscription Payment
      description: |-
        This endpoint will realize new payment for the same subscription as its
        parent payment with changeable price for different amount of shipped
        products or provided services.

        Through this endpoint, realization of subscription payment can be only done **once per given period**.

        * Fixed payment period
        * Variable payment amount

        If the realization return `parent.recurring_payments_available` as `false` the subscription should end, because the realization of new payments through the parent payment is no longer available.
        In this case, we recommend to inform the customer to create a new order for his favorite subscription.

        If you receive an HTTP status **202**, the payment state changes to `waiting_for_confirmation`.
        You will be notified [notification](#section/Notifications) about the result of the realization and any future changes in the payment state. The payment can change to the `paid` state (if the realization succeeds) or to the `error` state (if the realization fails).

        In case of an `error` state, you should check the `parent.recurring_payments_available` property in the [payment detail](#tag/Payments/paths/~1v1~1projects~1{project_id}~1payments~1{payment_uid}/get) response to determine if the subscription should end.
      tags:
        - Subscriptions
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - name: parent_payment_uid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Type_PaymentUid"
          description: |-
            UID of payment which initialized this subscription.
            It is the first payment created with `subscription.type` **usagebased** through endpoint [Create new payment](#tag/Payment-Creation/paths/~1v1~1projects~1{project_id}~1payments/post).
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  $ref: "#/components/schemas/Type_PaymentUid"
                amount:
                  description: |-
                    The amount in atomic unit of currency (cents), same currency as parent payment.
                  allOf:
                    - $ref: "#/components/schemas/Type_MoneyAmount"
                    - type: string
                      format: integer
                order_id:
                  $ref: "#/components/schemas/Type_OrderId"
                description_for_merchant:
                  $ref: "#/components/schemas/Type_DescriptionForMerchant"
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/PaymentItem"
                  description: |-
                    If this attribute is set to null, items will be copied from the parent payment.
                notif_url:
                  $ref: "#/components/schemas/NotifUrl"
              required:
                - uid
                - amount
              example:
                uid: efd7d8e6-asd5-3c46-b475-51762331b979
                amount: "10000"
                order_id: order-123
                description_for_merchant: description that will be shown in admin
                items:
                  - type: item
                    name: Some item
                    count: 2
                    total_price: "10000"
