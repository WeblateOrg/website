        - Preauthorized Payments
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/PaymentUidPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        $ref: "#/components/requestBodies/Realize_Preauthorized_PaymentBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - state
                properties:
                  state:
                    type: string
                    description: |-
                      New payment state changed by endpoint call
                    example: paid
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - state
                properties:
                  state:
                    type: string
                    description: |-
                      New payment state changed by endpoint call
                    example: waiting_for_confirmation
        "404":
          $ref: "#/components/responses/404"
        "422":
          description: Unprocessable entity, Payment is not in required state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: |-
                  Payment with specified UID: 'efd7d8e6-2fa3-3c46-b475-51762331bf56' is not in required state: 'preauthorized' (current state: 'waiting_for_confirmation')
  "/v1/projects/{project_id}/payments/{payment_uid}/preauthorized":
    post:
      summary: Realize Preauthorized Payment
      description: |-
        **!!! Deprecated use new endpoint version [V2 Realize Preauthorized Payment](#tag/Preauthorized-Payments/paths/~1v2~1projects~1{project_id}~1payments~1{payment_uid}~1preauthorized/post) instead!!!**

        This endpoint will realize a preauthorized payment.
      tags:
        - Preauthorized Payments
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/PaymentUidPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        $ref: "#/components/requestBodies/Realize_Preauthorized_PaymentBody"
      responses:
        "204":
          description: No Content
          headers:
            Deprecated:
              schema:
                type: string
              example: |-
                Use new endpoint version specify in API doc: https://docs.thepay.cz/#tag/Preauthorized-Payments/paths/~1v2~1projects~1{project_id}~1payments~1{payment_uid}~1preauthorized/post
          content:
            "*/*":
              example: ""
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          description: Unprocessable entity, Payment is not in required state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: |-
                  Payment with specified UID: 'efd7d8e6-2fa3-3c46-b475-51762331bf56' is not in required state: 'preauthorized' (current state: 'paid')
        "429":
          $ref: "#/components/responses/429"
    delete:
      summary: Cancel Preauthorized Payment
      description: |-
        This endpoint will cancel preauthorized payment.

        The time limit for cancellation of preauthorized payments may be shorter for some banks. In such case, you won't be able to cancel the preauthorization. The customer will receive his money back after the bank releases the blocked amount. In such cases, we will return the 422 response
      tags:
        - Preauthorized Payments
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/PaymentUidPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      responses:
        "204":
          description: No Content
          content:
            "*/*":
              example: ""
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          description: Unprocessable entity, Payment is not in required state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: |-
                  Payment with specified UID: 'efd7d8e6-2fa3-3c46-b475-51762331bf56' is not in required state: 'preauthorized' (current state: 'paid')
        "429":
          $ref: "#/components/responses/429"
  "/v1/projects/{project_id}/payments/{payment_uid}/refund":
    get:
      summary: Payment Refund Info
      description: |-
        Returns information about payment refund.
      tags:
        - Refunds
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/PaymentUidPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - available_amount
                  - currency
                  - partial_refunds
                properties:
                  available_amount:
                    description: |-
                      Represents how much money can be refunded to
                      customer, in atomic unit of currency (cents). If the value is zero, the payment
                      refund can not be created (the reason might typically be
                      that the payment was not paid or fully refunded, the
                      payment method might not support automatic refund, or
                      other cases).
                    allOf:
                      - $ref: "#/components/schemas/Type_MoneyAmount"
                  currency:
                    $ref: "#/components/schemas/Type_MoneyCurrency"
                  partial_refunds:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentRefund"
                example:
                  available_amount: 1000
                  currency: CZK
                  partial_refunds:
                    - amount: 9000
                      reason: Returned order, with broken goods
                      state: returned
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
    post:
      summary: Payment Refund Request
      description: |-
        This endpoint will create a request for automatic refund of a payment.
      tags:
        - Refunds
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/PaymentUidPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  description: |-
                    Amount which should be refunded, in atomic unit of currency (cents), currency used for refunding is the same as payment currency.
                    **Min 1, max not refunded amount, the actual value can be detected in [refund info](#tag/Refunds/paths/~1v1~1projects~1{project_id}~1payments~1{payment_uid}~1refund/get)**
                  allOf:
                    - $ref: "#/components/schemas/Type_MoneyAmount"
                reason:
                  type: string
                  description: The description of reason of refund.
              required:
                - amount
                - reason
              example:
                amount: 1000
                reason: Returned order, with broken goods
      responses:
        "201":
          description: Created
          content:
            "*/*":
              example: ""
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
  "/v1/projects/{project_id}/outgoing_payments/czk_domestic":
    post:
      summary: Creation of CZK Domestic Payment
      description: |-
        Endpoint for creating new outgoing payment to an account in Czech Republic (IBAN starting CZ). Only **CZK** currency is supported on this endpoint.
      tags:
        - Outgoing Payment Creation
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  $ref: "#/components/schemas/Type_OutgoingPaymentUid"
                offset_iban:
                  allOf:
                    - $ref: "#/components/schemas/Type_Iban"
                    - description: |-
                        IBAN from Czech Republic, which will receive this bank transaction.
                        The IBAN must start with CZ!

                        The IBAN must comply with the ISO 13616 standard and Czech national requirements, including modulo-11 validation for both the account prefix and account number. For more information, see the [CNB IBAN specifications](https://www.cnb.cz/export/sites/cnb/en/legislation/.galleries/decrees/decree_169_2011.pdf) and [CNB IBAN overview](https://www.cnb.cz/en/payments/iban/iban-international-bank-account-number-basic-information/).
                amount:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |-
                    amount in atomic unit of currency
                order_id:
                  $ref: "#/components/schemas/Type_OrderId"
                variable_symbol:
                  $ref: "#/components/schemas/Type_VariableSymbol"
                specific_symbol:
                  $ref: "#/components/schemas/Type_SpecificSymbol"
                constant_symbol:
                  $ref: "#/components/schemas/Type_ConstantSymbol"
                description_for_customer:
                  $ref: "#/components/schemas/Type_DescriptionForCustomer"
                description_for_merchant:
                  $ref: "#/components/schemas/Type_DescriptionForMerchant"
                notif_url:
                  $ref: "#/components/schemas/NotifUrl"
                customer_email:
                  description: |-
                    The e-mail for sending customer notification from ThePay system about outgoing payment.
                    The domain contained in the e-mail address must have a valid mx record.
                    If supplied by customer, we recommend checking the email, eg. with some sort of online DSN validation, for preventing typos.
                  allOf:
                    - $ref: "#/components/schemas/Type_EmailAddress"
                language_code:
                  allOf:
                    - $ref: "#/components/schemas/Type_LanguageCode"
                    - description: |-
                        Preferred language for payment related customer notification e-mail.
              required:
                - uid
                - offset_iban
                - amount
              example:
                uid: sad545g5ertwqaf
                offset_iban: CZ7650511122536259855711
                amount: 50000
                order_id: 2000111AAA
                variable_symbol: "459786"
                specific_symbol: "987934"
                constant_symbol: "1457"
                description_for_customer: "We're sending you 500.00 CZK ;-)."
                description_for_merchant: "Order 2000111AAA: The account CZ7650511122536259855711 was sent 500.00 CZK."
                notif_url: https://example.com/api/outgoing-payment/sad545g5ertwqaf/notification-callback
                customer_email: test@gmail.com
                language_code: cs
      responses:
        "201":
          $ref: "#/components/responses/201_OutgoingPayment"
  "/v1/projects/{project_id}/outgoing_payments/sepa":
    post:
      summary: Creation of EUR SEPA Payment
      description: |-
        Endpoint for creating new outgoing payment to account in a country supporting SEPA transactions. Only **EUR** currency is supported on this endpoint.
      tags:
        - Outgoing Payment Creation
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  $ref: "#/components/schemas/Type_OutgoingPaymentUid"
                offset_iban:
                  allOf:
                    - $ref: "#/components/schemas/Type_Iban"
                    - description: |-
                        IBAN from a country supporting SEPA transactions, which will receive this bank transaction.

                        The IBAN must comply with both the ISO 13616 international standard and the specific national requirements of the country whose ISO code is contained in the IBAN. This includes validation of the IBAN length, structure, and national checksum rules specific to each country.
                customer_name:
                  type: string
                  maxLength: 70
                  description: |-
                    Full name of person or company who will receive
                    bank transaction. If the name does not match the receiving
                    account holder, outgoing payment may be returned or
                    undeliverable!
                amount:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |-
                    amount in atomic unit of currency
                order_id:
                  $ref: "#/components/schemas/Type_OrderId"
                variable_symbol:
                  $ref: "#/components/schemas/Type_VariableSymbol"
                specific_symbol:
                  $ref: "#/components/schemas/Type_SpecificSymbol"
                constant_symbol:
                  $ref: "#/components/schemas/Type_ConstantSymbol"
                description_for_customer:
                  $ref: "#/components/schemas/Type_DescriptionForCustomer"
                description_for_merchant:
                  $ref: "#/components/schemas/Type_DescriptionForMerchant"
                notif_url:
                  $ref: "#/components/schemas/NotifUrl"
                customer_email:
                  description: |-
                    The e-mail for sending customer notification from ThePay system about outgoing payment.
                    The domain contained in the e-mail address must have a valid mx record.
                    If supplied by customer, we recommend checking the email, eg. with some sort of online DSN validation, for preventing typos.
                  allOf:
                    - $ref: "#/components/schemas/Type_EmailAddress"
                language_code:
                  allOf:
                    - $ref: "#/components/schemas/Type_LanguageCode"
                    - description: |-
                        Preferred language for payment related customer notification e-mail.
              required:
                - uid
                - offset_iban
                - customer_name
                - amount
              example:
                uid: sepajsasidoiadj
                offset_iban: SK6265282357628658372191
                customer_name: Some Name
                amount: 20000
                order_id: 2000111AAA
                variable_symbol: "459786"
                specific_symbol: "987934"
                constant_symbol: "1457"
                description_for_customer: "We're sending you 200.00 EUR ;-)."
                description_for_merchant: "Order 2000111AAA: The account SK6265282357628658372191 was sent 200.00 EUR."
                notif_url: https://example.com/api/outgoing-payment/sepajsasidoiadj/notification-callback
                customer_email: test@gmail.com
                language_code: cs
      responses:
        "201":
          $ref: "#/components/responses/201_OutgoingPayment"
  "/v1/projects/{project_id}/outgoing_payments/international":
    post:
      summary: Creation of International Payment
      description: |-
        Endpoint for creating new outgoing payment to account in any country and
        currency.

        **Currency code is permitted on agreed terms.**
      tags:
        - Outgoing Payment Creation
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  $ref: "#/components/schemas/Type_OutgoingPaymentUid"
                offset_iban:
                  allOf:
                    - $ref: "#/components/schemas/Type_Iban"
                    - description: |-
                        IBAN of the recipient account in any country and currency.

                        The IBAN must comply with both the ISO 13616 international standard and the specific national requirements of the country whose ISO code is contained in the IBAN. This includes validation of the IBAN length, structure, and national checksum rules specific to each country.
                customer_name:
                  type: string
                  maxLength: 70
                  description: |-
                    Full name of person or company who will receive
                    bank transaction. If the name does not match the receiving
                    account holder, outgoing payment may be returned or
                    undeliverable!
                amount:
                  type: integer
                  format: int32
                  minimum: 1
                  description: |-
                    amount in atomic unit of currency
                currency:
                  $ref: "#/components/schemas/Type_MoneyCurrency"
                order_id:
                  $ref: "#/components/schemas/Type_OrderId"
                description_for_customer:
                  $ref: "#/components/schemas/Type_DescriptionForCustomer"
                description_for_merchant:
                  $ref: "#/components/schemas/Type_DescriptionForMerchant"
                notif_url:
                  $ref: "#/components/schemas/NotifUrl"
                customer_email:
                  description: |-
                    The e-mail for sending customer notification from ThePay system about outgoing payment.
                    The domain contained in the e-mail address must have a valid mx record.
                    If supplied by customer, we recommend checking the email, eg. with some sort of online DSN validation, for preventing typos.
                  allOf:
                    - $ref: "#/components/schemas/Type_EmailAddress"
                language_code:
                  allOf:
                    - $ref: "#/components/schemas/Type_LanguageCode"
                    - description: |-
                        Preferred language for payment related customer notification e-mail.
              required:
                - uid
                - offset_iban
                - customer_name
                - amount
                - currency
              example:
                uid: interjsasidoiadj
                offset_iban: SK6265282357628658372191
                customer_name: Some Name
                amount: 20000
                currency: USD
                order_id: 2000111AAA
                description_for_customer: "We're sending you 200.00 USD ;-)."
                description_for_merchant: "Order 2000111AAA: The account SK6265282357628658372191 sent 200 USD."
                notif_url: https://example.com/api/outgoing-payment/international/notification-callback
                customer_email: test@gmail.com
                language_code: cs
      responses:
        "201":
          $ref: "#/components/responses/201_OutgoingPayment"
        "403":
          $ref: "#/components/responses/403"
        "409":
          description: |-
            Tried to insert a duplicate record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Outgoing payment with uid: 'interjsasidoiadj' already exists for the project: 1"
  "/v1/projects/{project_id}/outgoing_payments":
    get:
      summary: Get Outgoing Payments List
      description: |-
        This endpoint will list Outgoing Payments under given project (if any).
      tags:
        - Outgoing Payment Data Retrieval
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/StateQuery_OutgoingPayment"
        - $ref: "#/components/parameters/TypeQuery_OutgoingPayment"
        - $ref: "#/components/parameters/AmountFromQuery"
        - $ref: "#/components/parameters/AmountToQuery"
        - $ref: "#/components/parameters/CurrencyQuery"
        - $ref: "#/components/parameters/CreatedFromQuery"
        - $ref: "#/components/parameters/CreatedToQuery"
        - $ref: "#/components/parameters/SentFromQuery"
        - $ref: "#/components/parameters/SentToQuery"
        - $ref: "#/components/parameters/OrderIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutgoingPayment"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
  "/v1/projects/{project_id}/outgoing_payments/{payment_uid}":
    get:
      summary: Get Outgoing Payment Detail
      description: |-
        This endpoint will fetch a single Outgoing Payment by its UID and displays all relevant data.
      tags:
        - Outgoing Payment Data Retrieval
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/PaymentUidPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutgoingPayment"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
  "/v1/projects/{project_id}/outgoing_payments/{payment_uid}/generate_confirmation":
    get:
      summary: Get Outgoing Payment Confirmation
      description: |-
        This endpoint will generate a PDF confirmation of **sent** outgoing
        payment specified by *payment_uid*. If payment was not sent yet, you
        will get error 400. Response content-type is application/pdf which means
        that response contains binary data.
      tags:
        - Outgoing Payment Data Retrieval
      parameters:
        - $ref: "#/components/parameters/SignatureHeader"
        - $ref: "#/components/parameters/SignatureDateHeader"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/PaymentUidPath"
        - $ref: "#/components/parameters/MerchantIdQuery"
        - $ref: "#/components/parameters/LanguageQuery"
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
              example: ""
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
components:
  parameters:
    AmountFromQuery:
      name: amount_from
      in: query
      required: false
      schema:
        type: number
        description: |-
          WARNING decimal value, it is not Type_MoneyAmount
        example: 99.5
    AmountToQuery:
      name: amount_to
      in: query
      required: false
      schema:
        type: number
        description: |-
          WARNING decimal value, it is not Type_MoneyAmount
        example: 99.5
    BalanceAtQuery:
      name: balance_at
      in: query
      description: |-
        Datetime in ISO 8601 format,
        keep in mind that you need to encode "+" symbol in the URL to "%2B",
        if not present current time is used.
      required: false
      schema:
        type: string
        format: date-time
        example: 2023-03-14T15:08:44+00:00
    CreatedFromQuery:
      name: created_from
      in: query
      required: false
      schema:
        type: string
        format: date
        example: 2019-01-01
    CreatedToQuery:
      name: created_to
      in: query
      required: false
      schema:
        type: string
        format: date
        example: 2019-12-31
    FinishedFromQuery:
      name: finished_from
      in: query
      required: false
      schema:
        type: string
        format: date
        example: 2019-01-01
    FinishedToQuery:
      name: finished_to
      in: query
      required: false
      schema:
        type: string
        format: date
        example: 2019-12-31
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 25
        example: 100
        maximum: 1000
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        example: 1
    PaymentMethodQuery:
      name: payment_method
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PaymentMethodCode"
    PaymentUidPath:
      name: payment_uid
      in: path
      description: UID of the payment
      required: true
      schema:
        $ref: "#/components/schemas/Type_PaymentUid"
    ProjectIdQuery:
      name: project_id
      in: query
      description: ID of the project
      required: false
      schema:
        $ref: "#/components/schemas/Type_ProjectId"
    ProjectIdPath:
      name: project_id
      in: path
      description: ID of the project
      required: true
      schema:
        $ref: "#/components/schemas/Type_ProjectId"
    OrderIdQuery:
      name: order_id
      in: query
      description: |-
          ID of the purchase order
      required: false
      schema:
        $ref: "#/components/schemas/Type_OrderId"
    LanguageQuery:
      name: language
      in: query
      description: |-
          Currently supported translations are cs (for cs and sk), de, en (for other languages).
      required: false
      schema:
        allOf:
          - $ref: "#/components/schemas/Type_LanguageCode"
          - default: cs
    CountryCodesQuery:
      name: country_codes[]
      in: query
      description: |-
        filters payment methods by countries, if null only filter from administration setting will apply
      required: false
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/Type_CountryCode"
    CurrencyQuery:
      name: currency
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Type_MoneyCurrency"
    CurrencyCodeQuery:
      name: currency_code
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Type_MoneyCurrency"
    CurrencyCodesQuery:
      name: currency_codes[]
      in: query
      description: |-
        filters payment methods by currencies, if null payment methods with all curencies available are returned
      required: false
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/Type_MoneyCurrency"
    ForbiddenTagsQuery:
      name: forbidden_tags[]
      in: query
      description: |-
        removes all payment methods with specified tags from response
        if not present only the administration settings filter will apply
      required: false
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/Enum_MethodTag"
    MerchantIdQuery:
      name: merchant_id
      required: true
      in: query
      description: |-
        ID of the merchant
      schema:
        type: string
        format: uuid
        example: 6cdf1b24-0479-4a64-b076-b0ece482453f
    RequiredTagsQuery:
      name: required_tags[]
      in: query
      description: |-
        allows only payment methods with specified tags in response
        if not present only the administration settings filter will apply
      required: false
      schema:
        type: array
        minItems: 1
        items:
          $ref: "#/components/schemas/Enum_MethodTag"
    SentFromQuery:
      name: sent_from
      in: query
      required: false
      schema:
        type: string
        format: date
        example: 2019-01-01
    SentToQuery:
      name: sent_to
      in: query
      required: false
      schema:
        type: string
        format: date
        example: 2019-12-31
    StateQuery_OutgoingPayment:
      name: state
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Enum_OutgoingPaymentState"
    StateQuery_Payment:
      name: state
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Enum_PaymentState"
    SignatureHeader:
      name: Signature
      required: true
      in: header
      schema:
        type: string
        format: hexadecimal
        example: 8b5f48702995c1598c573db1e21866a9b825d4a794d169d7060a03605796360b
    SignatureDateHeader:
      name: SignatureDate
      required: true
      in: header
      schema:
        type: string
        format: rfc7231
        example: Mon, 23 Sep 2019 06:07:08 GMT
    TypeQuery_OutgoingPayment:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Enum_OutgoingPaymentType"
  requestBodies:
    Realize_Preauthorized_PaymentBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              amount:
                description: |-
                  The amount which should be charged, in atomic unit of currency (cents). This value can't exceed the original payment amount.
                allOf:
                  - $ref: "#/components/schemas/Type_MoneyAmount"
            required:
              - amount
            example:
              amount: 9945
  responses:
    "201_OutgoingPayment":
      description: |-
        Outgoing payment was created
      content:
        application/json:
          schema:
            type: object
            required:
              - outgoing_payment_id
            properties:
              outgoing_payment_id:
                $ref: "#/components/schemas/Type_OutgoingPaymentId"
    "400":
      description: |-
        Bad request, stands for validation errors
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Description of validation error message
    "401":
      description: |-
        Unauthorized, the signature is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Description of error message, e.g. Invalid signature!
    "403":
      description: |-
        Forbidden, missing merchant_id, Signature, SignatureDate or the request was made from an IP address not allowed in the whitelist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Description of error message, e.g. Not allowed IP detected
    "404":
      description: |-
        Not found, some identifier is incorrect
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: |-
        Tried to insert a duplicate record
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "422":
      description: |-
        Unprocessable entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "429":
      description: |-
        Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Description of error message, e.g. You have exceeded your rate limit
    "503":
      description: |-
        Service unavailable due to maintenance,
        detail information are in [maintenance section](#section/Maintenance)
      headers:
        Unavailable-Until:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: Service Unavailable
  schemas:
    Address:
      type: object
      required:
        - country_code
        - city
        - zip
        - street
      properties:
        country_code:
          $ref: "#/components/schemas/Type_CountryCode"
        city:
          type: string
          maxLength: 100
          description: |-
            city name
          example: London
        zip:
          type: string
          maxLength: 20
          description: |-
            zip code
          example: NW1
        street:
          type: string
          maxLength: 100
          description: street name with house number
          example: Baker Street 221B
    Customer:
      type: object
      required:
        - name
        - surname
      properties:
        name:
          type: string
          example: Jane
        surname:
          type: string
          example: Doe
        email:
          allOf:
            - $ref: "#/components/schemas/Type_EmailAddress"
            - description: |-
                **required** if phone is not present
        phone:
          type: string
          format: msisdn
          maxLength: 15
          example: 420589687963
          description: |-
            **required** if email is not present
        billing_address:
          allOf:
            - $ref: "#/components/schemas/Address"
            - nullable: true
        shipping_address:
          allOf:
            - $ref: "#/components/schemas/Address"
            - nullable: true
    NotifUrl:
      allOf:
        - $ref: "#/components/schemas/Type_Url"
        - maxLength: 4000
          description: |-
            Valid HTTPS URL that will be used for notifications.
            It is optional, default project notif URL will be used if provided URL is empty.
            If project has also empty notification URL, it is **required**!

            Learn more about [Notifications](#section/Notifications)
    PaymentItem:
      type: object
      required:
        - type
        - name
        - count
        - total_price
      properties:
        type:
          type: string
          enum:
            - item
            - delivery
            - discount
          description: item, delivery or discount
        name:
          type: string
          example: Some item
        count:
          type: integer
          example: 2
        total_price:
          allOf:
            - $ref: "#/components/schemas/Type_MoneyAmount"
            - type: string
        ean:
          type: string
          format: ean13
          minLength: 1
          maxLength: 13
          example: 9781565924796
    Currency:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/Type_MoneyCurrency"
        numeric_code:
          type: string
          format: iso4217
          description: |-
            ISO 4217 numeric code of currency
          example: "203"
    Project:
      type: object
      required:
        - project_id
        - project_url
        - account_iban
      properties:
        project_id:
          $ref: "#/components/schemas/Type_ProjectId"
        project_url:
          allOf:
            - $ref: "#/components/schemas/Type_Url"
            - maxLength: 255
              description: |-
                url where the project is available online
        account_iban:
          $ref: "#/components/schemas/Type_Iban_Internal"
      example:
        project_id: 5
        project_url: https://some-url.cz
        account_iban: TP7811112150822790787055
    Account:
      type: object
      required:
        - iban
        - name
      properties:
        iban:
          $ref: "#/components/schemas/Type_Iban_Internal"
        name:
          type: string
          description: |-
            Name of account that was set by merchant.
          example: "Account #1"
    Method:
      type: object
      required:
        - code
        - title
      properties:
        code:
          type: string
          example: card
        title:
          type: string
          example: Card Payment
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Enum_MethodTag"
        available_currencies:
          type: array
          items:
            $ref: "#/components/schemas/Currency"
        image:
          type: object
          properties:
            src:
              allOf:
                - $ref: "#/components/schemas/Type_Url"
                - description: |-
                    The image source address
    Payment:
      type: object
      required:
        - uid
        - state
        - currency
        - amount
        - paid_amount
        - created_at
        - valid_to
        - pay_url
        - detail_url
        - customer
        - offset_account_status
        - events
      properties:
        uid:
          $ref: "#/components/schemas/Type_PaymentUid"
        project_id:
          $ref: "#/components/schemas/Type_ProjectId"
        order_id:
          allOf:
            - $ref: "#/components/schemas/Type_OrderId"
            - nullable: true
        state:
          $ref: "#/components/schemas/Enum_PaymentState"
        currency:
          $ref: "#/components/schemas/Type_MoneyCurrency"
        amount:
          $ref: "#/components/schemas/Type_MoneyAmount"
        paid_amount:
          $ref: "#/components/schemas/Type_MoneyAmount"
        created_at:
          $ref: "#/components/schemas/Type_DateTime"
        finished_at:
          allOf:
            - $ref: "#/components/schemas/Type_DateTime"
            - nullable: true
        valid_to:
          description: |-
            Date and time until which the payment is valid, i.e. the deadline by which the customer can pay it.
            After this time the payment expires and can no longer be paid.
          allOf:
            - $ref: "#/components/schemas/Type_DateTime"
        fee:
          $ref: "#/components/schemas/Type_MoneyAmount"
        description:
          type: string
          nullable: true
          description: |-
            Value provided under description_for_customer when payment was created.
        description_for_merchant:
          allOf:
            - $ref: "#/components/schemas/Type_DescriptionForMerchant"
            - nullable: true
        payment_method:
          type: string
          nullable: true
        pay_url:
          allOf:
            - $ref: "#/components/schemas/Type_Url"
            - description: |-
                When the payment method is chosen redirects to the payment process with the particular payment method.
                Otherwise the customer will be presented with list of payment methods to choose from.
                In case the payment is already paid, the customer will be redirected to payment detail page.
        detail_url:
          allOf:
            - $ref: "#/components/schemas/Type_Url"
        customer:
          type: object
          properties:
            name:
              type: string
            ip:
              type: string
              format: ip address
              nullable: true
            email:
              allOf:
                - $ref: "#/components/schemas/Type_EmailAddress"
                - nullable: true
        offset_account:
          type: object
          nullable: true
          properties:
            iban:
              allOf:
                - $ref: "#/components/schemas/Type_Iban"
                - nullable: true
                  description: |-
                    IBAN of bank account in international format, from where payment was received
            owner_name:
              type: string
              maxLength: 100
              nullable: true
              description: |-
                account owner of bank account, from where payment was received
        offset_account_status:
          $ref: "#/components/schemas/Enum_OffsetAccountState"
        offset_account_determined_at:
          $ref: "#/components/schemas/Type_DateTime"
        card:
          type: object
          nullable: true
          required:
            - number
          properties:
            number:
              type: string
              maxLength: 19
              description: |-
                **contains only digits and star characters**,
                masked payment card number,
                number and position of stars can change for each payment
            expiration_date:
              type: string
              format: iso8601 as 'Y-m'
              nullable: true
              description: |-
                payment card expiration date
            brand:
              type: string
              maxLength: 255
              nullable: true
              description: |-
                brand of payment card
            type:
              type: string
              enum:
                - credit
                - debit
                - prepaid
                - unknown
              description: |-
                Type of card that was used
          description: |-
            information about payment card used to pay the payment,
            if payment is **not paid by payment method with tag: `card`**, this property **is null!**
        variable_symbol:
          description: |-
            Variable symbol of payment.
          allOf:
            - $ref: "#/components/schemas/Type_VariableSymbol"
        events:
          type: array
          items:
            $ref: "#/components/schemas/PaymentEvent"
        parent:
          type: object
          nullable: true
          required:
            - recurring_payments_available
          properties:
            recurring_payments_available:
              type: boolean
              description: |-
                Detection if is possible realization of new payments by [subscription](#tag/Subscriptions)
                or [saved card authorization](#tag/Saved-Card-Authorization)
          description: |-
            Short detail of parent payment, property contains object only if payment was created by realizating [subscription](#tag/Subscriptions)
            or [saved card authorization](#tag/Saved-Card-Authorization)
      example:
        uid: efd7d8e6-2fa3-3c46-b475-51762331bf56
        project_id: 1
        order_id: CZ12131415
        state: paid
        currency: CZK
        amount: 87654
        paid_amount: 87654
        created_at: 2019-01-01T12:00:00+00:00
        finished_at: 2019-01-01T12:00:00+00:00
        valid_to: 2019-01-01T12:00:00+00:00
        fee: 121
        description: Some description of the payment purpose.
        description_for_merchant: Some description for merchant.
        payment_method: transfer
        pay_url: https://gate.thepay.cz/12345/pay
        detail_url: https://gate.thepay.cz/12345/state
        customer:
          name: Joe Doe
          ip: 192.168.0.1
          email: joe.doe@gmail.com
        offset_account:
          iban: CZ6508000000192000145399
          owner_name: Joe Doe
        offset_account_status: not_available
        offset_account_determined_at: 2019-01-01T12:00:00+00:00
        card:
          number: 515735******2654
          expiration_date: 2022-05
          brand: MASTERCARD
          type: debit
        variable_symbol: "1234567890"
        events:
          - occured_at: 2021-04-20T11:05:49.000000Z
            type: state_change
            data: expired
        parent:
          recurring_payments_available: true
    OutgoingPayment:
      allOf:
        - type: object
          required:
            - uid
            - project_id
            - state
            - type
            - amount
            - currency_code
            - created_at
          properties:
            uid:
              $ref: "#/components/schemas/Type_OutgoingPaymentUid"
            project_id:
              $ref: "#/components/schemas/Type_ProjectId"
            order_id:
              allOf:
                - $ref: "#/components/schemas/Type_OrderId"
                - nullable: true
            state:
              $ref: "#/components/schemas/Enum_OutgoingPaymentState"
            type:
              $ref: "#/components/schemas/Enum_OutgoingPaymentType"
            amount:
              $ref: "#/components/schemas/Type_MoneyAmount"
            currency_code:
              $ref: "#/components/schemas/Type_MoneyCurrency"
            offset_iban:
              allOf:
                - $ref: "#/components/schemas/Type_Iban"
                - nullable: true
            vs:
              description: |-
                Variable symbol of outgoing payment.
                Only numerically positive symbols are allowed,
                for example "00001", "000" or "0" are invalid!
              allOf:
                - $ref: "#/components/schemas/Type_VariableSymbol"
                - nullable: true
            ss:
              description: |-
                Specific symbol of outgoing payment.
                Only numerically positive symbols are allowed,
                for example "00001", "000" or "0" are invalid!
              allOf:
                - $ref: "#/components/schemas/Type_SpecificSymbol"
                - nullable: true
            ks:
              description: |-
                Constant symbol of outgoing payment.
                Only numerically positive symbols are allowed,
                for example "00001", "000" or "0" are invalid!
                Send the symbol without leading zeros, for example "308" instead of "0308".
              allOf:
                - $ref: "#/components/schemas/Type_ConstantSymbol"
                - nullable: true
            description_for_merchant:
              allOf:
                - $ref: "#/components/schemas/Type_DescriptionForMerchant"
                - nullable: true
            description_for_customer:
              allOf:
                - $ref: "#/components/schemas/Type_DescriptionForCustomer"
                - nullable: true
            notif_url:
              allOf:
                - $ref: "#/components/schemas/NotifUrl"
                - nullable: true
            customer_email:
              allOf:
                - $ref: "#/components/schemas/Type_EmailAddress"
                - nullable: true
            customer_name:
              nullable: true
              type: string
            created_at:
              $ref: "#/components/schemas/Type_DateTime"
            sent_at:
              allOf:
                - $ref: "#/components/schemas/Type_DateTime"
                - nullable: true
          example:
            uid: sad545g5ertwqaf
            project_id: 1
            order_id: 2000111AAA
            state: sent
            type: domestic_czk
            amount: 50000
            currency_code: CZK
            offset_iban: CZ7650511122536259855711
            vs: "459786"
            ss: "987934"
            ks: "1457"
            description_for_merchant: "Order 2000111AAA: The account CZ7650511122536259855711 was sent 500.00 CZK."
            description_for_customer: "We're sending you 500.00 CZK."
            notif_url: https://example.com/api/outgoing-payment/sad545g5ertwqaf/notification-callback
            customer_email: test@gmail.com
            customer_name: John Doe
            created_at: 2019-01-01T12:00:00+00:00
            sent_at: 2019-01-01T12:00:00+00:00
    PaymentEvent:
      type: object
      required:
        - occured_at
        - type
      properties:
        occured_at:
          type: string
          example: 2021-04-20T11:05:49.000000Z
        type:
          type: string
          enum:
            - method_selection
            - state_change
            - unavailable_method
            - payment_cancelled
            - payment_error
          example: state_change
        data:
          type: string
          nullable: true
          example: expired
    RecurringPaymentResult:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - success
            - failed
            - expired
          description: Result how new payment realization finish.
        message:
          type: string
          nullable: true
          description: |-
            Description of state what was happens, if is available.
          example: Ok
    SynchRecurringPaymentResult:
      type: object
      required:
        - state
        - parent
      properties:
        state:
          type: string
          enum:
            - paid
            - error
          description: |-
            Result how new payment realization finish.
        message:
          type: string
          nullable: true
          description: |-
            Description of state what was happens, if is available.
          example: Ok
        parent:
          type: object
          required:
            - recurring_payments_available
          properties:
            recurring_payments_available:
              type: boolean
              description: |-
                Detection if is possible realization of new payments by [subscription](#tag/Subscriptions)
                or [saved card authorization](#tag/Saved-Card-Authorization)
              example: true
    WaitingConfirmationRecurringPaymentResult:
      type: object
      required:
        - state
        - parent
      properties:
        state:
          type: string
          enum:
            - waiting_for_confirmation
          description: Result how new payment realization finish.
        message:
          type: string
          nullable: true
          description: |-
            Description of state what was happens, if is available.
          example: Waiting for confirmation from external system
        parent:
          type: object
          required:
            - recurring_payments_available
          properties:
            recurring_payments_available:
              type: boolean
              description: |-
                Detection if is possible realization of new payment by [subscription](#tag/Subscriptions)
                or [saved card authorization](#tag/Saved-Card-Authorization)
              example: true
    PaymentRefund:
      type: object
      required:
        - amount
        - reason
        - state
      properties:
        amount:
          $ref: "#/components/schemas/Type_MoneyAmount"
        reason:
          type: string
          maxLength: 16777215
          description: |-
            The description why the refund is needed.
          example: Returned order, with broken goods
        state:
          type: string
          enum:
            - waiting
            - returned
            - declined
          description: State of refunding
    State:
      type: object
      required:
        - state
      properties:
        state:
          type: number
          example: 1
          description: ID of the payment state (1-9)
    PaymentMethod:
      type: object
      required:
        - code
        - title
      properties:
        code:
          $ref: "#/components/schemas/PaymentMethodCode"
        title:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Enum_MethodTag"
        available_currencies:
          type: array
          items:
            type: object
            properties:
              code:
                $ref: "#/components/schemas/Type_MoneyCurrency"
              numeric_code:
                type: string
                format: integer
                description: |-
                    ISO 4217 numeric code of currency
        image:
          type: object
          properties:
            src:
              $ref: "#/components/schemas/Type_Url"
      example:
        code: card
        title: Card Payment
        tags:
          - online
          - returnable
        available_currencies:
          - code: CZK
            numeric_code: "203"
        image:
          src: https://neco.cz
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: |-
            Description of error message
          example: Project was not found
    Transaction:
      type: object
      required:
        - transaction_id
        - amount
        - currency_code
        - transaction_type
        - note
        - realized_at
      properties:
        transaction_id:
          type: number
          description: |-
            ID of the transaction
          example: 10
        amount:
          $ref: "#/components/schemas/Type_MoneyAmount"
        currency_code:
          $ref: "#/components/schemas/Type_MoneyCurrency"
        transaction_type:
          $ref: "#/components/schemas/Enum_TransactionType"
        note:
          type: string
          description: |-
            Transaction's description
          example: Some description of the payment purpose.
        offset_account:
          type: object
          nullable: true
          required:
            - iban
            - owner_name
          properties:
            iban:
              $ref: "#/components/schemas/Type_Iban"
            owner_name:
              type: string
              example: Joe Doe
              description: Name of account owner
          description: |-
            Offset account of transaction
        payment_identificator:
          type: object
          nullable: true
          required:
            - project_id
            - uid
          properties:
            project_id:
              description: |-
                ID of the project under which was payment made
              allOf:
                - $ref: "#/components/schemas/Type_ProjectId"
            uid:
              $ref: "#/components/schemas/Type_PaymentUid"
          description: |-
            Identificator of relevant payment. For incoming payments it refers to the
            [payment](#tag/Payments/paths/~1v1~1projects~1{project_id}~1payments~1{payment_uid}/get),
            for `sent_payment` transactions and transactions linked to a sent payment
            (fees, payment returned by bank) it refers to the
            [outgoing payment](#tag/Outgoing-Payment-Data-Retrieval/paths/~1v1~1projects~1{project_id}~1outgoing_payments~1{payment_uid}/get).
        realized_at:
          $ref: "#/components/schemas/Type_DateTime"
        vs:
          allOf:
            - $ref: "#/components/schemas/Type_VariableSymbol"
            - nullable: true
        ss:
          allOf:
            - $ref: "#/components/schemas/Type_SpecificSymbol"
            - nullable: true
        ks:
          allOf:
            - $ref: "#/components/schemas/Type_ConstantSymbol"
            - nullable: true
      example:
        transaction_id: 10
        amount: 87654
        currency_code: CZK
        transaction_type: payment
        note: Some description of the payment purpose.
        offset_account:
          iban: CZ6508000000192000145399
          owner_name: Joe Doe
        payment_identificator:
          project_id: 2
          uid: efd7d8e6-2fa3-3c46-b475-51762331bf56
        realized_at: 2019-01-01T12:00:00+00:00
        vs: "12345678"
        ss: "1801076"
        ks: "301"
    AccountBalance:
      type: object
      required:
        - iban
        - name
        - balance
      properties:
        iban:
          $ref: "#/components/schemas/Type_Iban_Internal"
        name:
          type: string
          description: Name of account that was set by merchant.
        balance:
          type: object
          properties:
            CZK:
              allOf:
                - $ref: "#/components/schemas/Type_MoneyAmount"
                - type: string
                  format: integer
            EUR:
              allOf:
                - $ref: "#/components/schemas/Type_MoneyAmount"
                - type: string
                  format: integer
            USD:
              allOf:
                - $ref: "#/components/schemas/Type_MoneyAmount"
                - type: string
                  format: integer
          description: |-
            Object contains balances for used currencies on account.
      example:
        iban: TP7811112150822790787055
        name: "Account #1"
        balance:
          CZK: "1256"
          EUR: "231"
          USD: "0"
    Money:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Type_MoneyAmount"
        currency:
          $ref: "#/components/schemas/Type_MoneyCurrency"
      required:
        - amount
        - currency
    MoneyLegacy:
      type: object
      properties:
        amount:
          allOf:
            - $ref: "#/components/schemas/Type_MoneyAmount"
            - type: string
              format: integer
        currency:
          $ref: "#/components/schemas/Type_MoneyCurrency"
      required:
        - amount
        - currency
    PaymentMethodCode:
      type: string
      description: |-
        Payment method code
      example:
        transfer
    Payment_Creation:
      type: object
      required:
        - pay_url
        - detail_url
      properties:
        pay_url:
          allOf:
            - $ref: "#/components/schemas/Type_Url"
            - description: |-
                When the payment method is chosen redirects to the payment process with the particular payment method.
                Otherwise the customer will be presented with list of payment methods to choose from.
                In case the payment is already paid, the customer will be redirected to payment detail page.
        detail_url:
          allOf:
            - $ref: "#/components/schemas/Type_Url"
            - description: |-
                Url to payment detail page displaying the current payment state.
      example:
        pay_url: https://gate.thepay.cz/12345/pay
        detail_url: https://gate.thepay.cz/12345/state
    Payment_Url:
      type: object
      required:
        - code
        - title
        - url
      properties:
        code:
          $ref: "#/components/schemas/PaymentMethodCode"
        title:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Enum_MethodTag"
        image:
          type: object
          properties:
            src:
              $ref: "#/components/schemas/Type_Url"
        url:
          $ref: "#/components/schemas/Type_Url"
      example:
        code: card
        title: Card Payment
        tags:
          - online
          - returnable
        image:
          src: https://gate.thepay.cz/img/payment_methods/card.svg
        url: https://gate.thepay.cz/1/update?payment_method_code=card_six
    TestData:
      type: object
      properties:
        testData:
          nullable: true
          type: string
          example: test
    # enums
    Enum_MethodTag:
      type: string
      enum:
        - returnable
        - pre_authorization
        - recurring_payments
        - access_account_owner
        - online
        - card
        - bank_transfer
        - alternative_method
      description: |-
        | Value | Description |
        | --- | --- |
        | `returnable` | This payment can be returned to the customer after it is paid |
        | `pre_authorization` | Preauthorization is available |
        | `recurring_payments` | [Subscription payments](#introduction/subscription-payments) and [saving authorization](#introduction/saving-card-authorization) are available |
        | `access_account_owner` | The owner of account which the payment was paid from is accessible |
        | `online` | Online payment |
        | `card` | Payment by card |
        | `bank_transfer` | Payments by bank transfer |
        | `alternative_method` | Alternative methods of payment, e.g. bitcoin |
      example: bank_transfer
    Enum_OffsetAccountState:
      type: string
      enum:
        - not_available
        - waiting
        - loaded
      description: |-
        | Value | Description |
        | --- | --- |
        | `not_available` | The account information is not available for selected payment method or we weren't able to acquire it. |
        | `waiting` | We're waiting to get info about offset account at the moment. |
        | `loaded` | The information about offset account is available. |
      example: loaded
    Enum_OutgoingPaymentState:
      type: string
      enum:
        - waiting
        - sent
        - cancelled
        - undeliverable
        - returned
      description: |-
        | Value | Description |
        |---|---|
        | `waiting` | The payment was created and its waiting to be processed |
        | `sent` | The payment was successfully sent |
        | `cancelled` | The payment was cancelled |
        | `undeliverable` | It was not possible to deliver the payment |
        | `returned` | The payment was returned|
      example: sent
    Enum_OutgoingPaymentType:
      type: string
      enum:
        - domestic_czk
        - sepa
        - international
      description: |-
        | Value | Description |
        |---|---|
        | `domestic_czk` | Domestic payment in CZK currency |
        | `sepa` | SEPA payment |
        | `international` | International payment |
      example: domestic_czk
    Enum_PaymentState:
      type: string
      enum:
        - expired
        - paid
        - partially_refunded
        - refunded
        - preauthorized
        - preauth_cancelled
        - preauth_expired
        - waiting_for_payment
        - waiting_for_confirmation
        - error
      description: |-
        | Value | Description |
        |---|---|
        | `expired` | The payment is expired - in case it was not paid in time limit |
        | `paid` | The payment was paid |
        | `partially_refunded` | Part of the payment was sent back to the customer, the payment was already paid |
        | `refunded` | The payment was returned to the customer fully |
        | `preauthorized` | The payment was preauthorized |
        | `preauth_cancelled` | Preuthorization was cancelled |
        | `preauth_expired` | Preauthorized payment has expired |
        | `waiting_for_payment` | Initial state |
        | `waiting_for_confirmation` | Waiting for confirmation from bank |
        | `error` | Child payment failed. Used for subscriptions and saved card authorization. |
      example: paid
    Enum_TransactionType:
      type: string
      enum:
        - payment
        - refund
        - fee
        - payoff
        - sent_payment
        - interest
        - payoff
        - incoming
      example: payment
    # types (atomic and 3rd party)
    Type_ConstantSymbol:
      type: string
      format: integer
      maxLength: 10
      description: |-
        Only numerically positive symbols are allowed,
        for example "00001", "000" or "0" are invalid!
        Send the symbol without leading zeros, for example "308" instead of "0308".
      example: 308
    Type_CountryCode:
      type: string
      format: iso3166-1-alpha-2
      example: CZ
    Type_DateTime:
      type: string
      format: date-time
      description: |-
        Datetime in RFC 3339 / ISO 8601 format, keep in mind that you need to encode "+" symbol in the URL to "%2B"
      example: 2019-09-23T09:49:54+02:00
    Type_DescriptionForCustomer:
      type: string
      maxLength: 255
      description: |-
        The payment description shown to the customer.
      example: Duis quis libero tempor, tincidunt ligula sit amet, mattis erat.
    Type_DescriptionForMerchant:
      type: string
      maxLength: 255
      description: |-
        The payment description visible only to the merchant.
      example: Cras a urna sed est ornare rutrum in eget justo.
    Type_EmailAddress:
      type: string
      format: e-mail address
      description: |-
        The domain contained in the e-mail address must have a valid mx record.
        If supplied by customer, we recommend checking the email, eg. with some sort of online DSN validation, for preventing typos.
      example: jane.doe@example.com
    Type_Iban:
      type: string
      format: iso13616
      maxLength: 34
      example: CZ6508000000192000145399
    Type_Iban_Internal:
      allOf:
        - $ref: "#/components/schemas/Type_Iban"
        - description: |-
            ThePay special IBAN format.
            Number of a virtual ThePay account, where customer payments are settled.
            IBAN format is based on [CZ IBAN](https://www.cnb.cz/export/sites/cnb/cs/platebni-styk/.galleries/pravni_predpisy/download/vyhl_169_2011.pdf), first 2 chars are replaced by TP and chars from fifth to eight position must be ignored because they are invalid.

            Internal IBAN, which can be *USED ONLY IN OUR SYSTEM*, for example getting account transaction history.
            Using it outside of ThePay systems is prohibited and results in error/losing money.
          example: TP7811112150822790787055
    Type_LanguageCode:
      type: string
      format: iso639
      example: cs
    Type_MoneyAmount:
      type: integer
      format: int32
      description: |-
        amount in atomic unit of currency
      example: 9950
    Type_MoneyCurrency:
      type: string
      format: iso4217
      minLength: 3
      maxLength: 3
      description: |-
        ISO 4217 code of currency
      example: CZK
    Type_OrderId:
      type: string
      minLength: 1
      maxLength: 100
      description: |-
        An order identifier used as a custom reference for payment. It's not necessarily unique.
      example: CZ12131415
    Type_OutgoingPaymentId:
      type: integer
      minimum: 1
      description: |-
        Unique identifier assigned by ThePay system.
      example: 6554
    Type_OutgoingPaymentUid:
      type: string
      maxLength: 100
      description: |-
        Outgoing payment identification in your system,
        must be unique per project.
      example: 78107c25-2d01-414e-8c53-bb9a3cf3c10b
    Type_PaymentUid:
      type: string
      maxLength: 100
      description: |-
        Payment identification in your system,
        must be unique per project.
      example: efd7d8e6-2fa3-3c46-b475-51762331bf56
    Type_PhoneNumber:
      type: string
      format: msisdn
      maxLength: 15
      description: |-
        https://en.wikipedia.org/wiki/MSISDN
      example: 420589687963
    Type_ProjectId:
      type: integer
      format: int32
      minimum: 1
      example: 1
      description: |-
        ID of the project
    Type_SpecificSymbol:
      type: string
      format: integer
      maxLength: 10
      description: |-
        Only numerically positive symbols are allowed,
        for example "00001", "000" or "0" are invalid!
      example: 23214
    Type_Url:
      type: string
      format: url
      example: https://example.com/
    Type_VariableSymbol:
      type: string
      format: integer
      maxLength: 10
      description: |-
        Only numerically positive symbols are allowed,
        for example "00001", "000" or "0" are invalid!
      example: 76643
